name: Release

'on':
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          # Tags may be prefixed with "v"; CHANGELOG.md headings are not.
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section between ## [VERSION] and the next ## [
          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 { flag = 1; next }
            /^## \[/ { flag = 0 }
            flag
          ' CHANGELOG.md > /tmp/release_body.md
          if [ ! -s /tmp/release_body.md ]; then
            echo "::error title=Changelog missing::No '## [${VERSION}]' section found in CHANGELOG.md."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A version with a suffix (1.2.0-beta.1) is a pre-release and must not become "Latest".
          if [[ "${VERSION}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Taskmaster ${{ steps.changelog.outputs.version }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: ${{ steps.changelog.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.changelog.outputs.prerelease == 'true' && 'false' || 'true' }}
