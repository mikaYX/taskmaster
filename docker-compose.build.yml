# Same stack as docker-compose.yml, but the app is built locally instead of pulled from the registry.
# To test changes without push/pull. Uses the same .env.
#
# Persistence: same as docker-compose.yml (volumes postgres_data, redis_data, app_*).
# To avoid going through the setup wizard on every "up": never run "down -v" (keep the volumes).
# Same project name as docker-compose.yml, to reuse the same volumes.
#
# Usage: docker compose -f docker-compose.build.yml up --build -d

name: taskmaster

services:
  postgres:
    image: postgres:18-alpine
    container_name: ${POSTGRES_CONTAINER_NAME:-taskmaster_db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4-alpine
    container_name: ${REDIS_CONTAINER_NAME:-taskmaster_redis}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-storage:
    image: taskmaster:local
    pull_policy: never
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown -R 1000:1000 /data/todo-attachments /data/exports"]
    volumes:
      - app_todo_attachments:/data/todo-attachments
      - app_exports:/data/exports

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskmaster:local
    container_name: ${APP_CONTAINER_NAME:-taskmaster_app}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    volumes:
      - app_backups:/app/backups
      - app_uploads:/app/public/uploads
      - app_procedures:/app/storage/procedures
      - app_evidence:/app/storage/evidence
      - app_todo_attachments:/app/storage/todo-attachments
      - app_exports:/app/exports
    depends_on:
      app-storage:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  app_backups:
  app_uploads:
  app_procedures:
  app_evidence:
  app_todo_attachments:
  app_exports:
