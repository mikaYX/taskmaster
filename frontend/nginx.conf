server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ──────────────────────────────────────────────────────────────────────
    # Headers de sécurité (appliqués à TOUTES les réponses, y compris les
    # erreurs grâce à `always`).
    # Notes :
    #  - Le HSTS reste modéré (180 j) pour éviter de bloquer une expérience
    #    HTTP-only en dev ; à passer à `max-age=63072000; includeSubDomains;
    #    preload` en production HTTPS éprouvée.
    #  - La CSP est en mode Report-Only pour ne rien casser ; activer la
    #    version stricte (Content-Security-Policy) après validation des
    #    rapports. 'unsafe-inline' style est requis par Tailwind/Radix ;
    #    'unsafe-inline' script est volontairement absent.
    #  - X-Frame-Options conservé pour les vieux navigateurs (la directive
    #    frame-ancestors de la CSP la remplace sur les modernes).
    # ──────────────────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip validation
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform" always;
        # Réémission des headers de sécurité car `add_header` ne fusionne pas entre blocs.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
